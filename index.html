<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Virar APK</title>
  <style>
    body { font-family: Arial; background:#000; color:#0f0; text-align:center; padding-top:100px; }
    input { width:70%; padding:15px; font-size:18px; }
    button { padding:15px 30px; font-size:18px; background:#0f0; border:none; cursor:pointer; }
  </style>
</head>
<body>
  <h1>COLA O LINK E VIRA APK</h1>
  
  <input type="url" id="url" placeholder="https://seusite.com" />
  <br><br>
  <button onclick="gerar()">GERAR</button>

  <div id="res"></div>

  <script>
    async function gerar() {
      let url = document.getElementById('url').value;
      document.getElementById('res').innerHTML = "Gerando... 1 min";
      
      let r = await fetch("https://pwabuilder-api.azurewebsites.net/api/manifest", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: url }) // SÓ A URL. NADA MAIS
      });
      
      let data = await r.json();
      document.getElementById('res').innerHTML = `<a href="${data.androidPackageUrl}"><button>BAIXAR APK</button></a>`;
    }
  </script>
</body>
</html>
