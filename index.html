<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar de Promoções & Descontos 🕹️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0e14;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 8px;
      color: #00ffcc;
      text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
    }

    p.subtitle {
      color: #8a99ad;
      margin-bottom: 20px;
      font-size: 0.95rem;
    }

    /* Painel do Filtro */
    .filter-container {
      background-color: #161b22;
      border: 1px solid #30363d;
      padding: 15px 25px;
      border-radius: 12px;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    label {
      font-weight: bold;
      color: #00ffcc;
    }

    select {
      background-color: #0d1117;
      color: #fff;
      border: 1px solid #00ffcc;
      padding: 8px 15px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      outline: none;
    }

    select:focus {
      box-shadow: 0 0 8px #00ffcc;
    }

    .status {
      margin: 20px 0;
      font-size: 1.1rem;
      color: #ffcc00;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1000px;
    }

    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover, .card:focus {
      transform: translateY(-5px);
      border-color: #00ffcc;
      outline: none;
    }

    .card img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      background-color: #0d1117;
    }

    .card-content {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .card-title {
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .price-tag {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .badge-discount {
      background-color: #238636;
      color: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .price-details {
      font-size: 0.9rem;
      color: #8a99ad;
    }

    .btn-buy {
      display: block;
      text-align: center;
      background-color: #1f6feb;
      color: #ffffff;
      text-decoration: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn-buy:hover {
      background-color: #388bfd;
    }
  </style>
</head>
<body>

  <h1>🎯 Radar de Promoções & Descontos</h1>
  <p class="subtitle">Escolha o nível de desconto e encontre as melhores pechinchas da internet!</p>

  <div class="filter-container">
    <label for="discount-select">Filtrar Desconto Mínimo:</label>
    <select id="discount-select" onchange="buscarPromocoes()">
      </select>
  </div>

  <div id="status" class="status">Carregando promoções... 🚀</div>
  <div id="games-grid" class="grid"></div>

  <script>
    // Preenche o menu <select> de 100% até 5% descendo de 5 em 5
    const selectElement = document.getElementById('discount-select');
    for (let i = 100; i >= 5; i -= 5) {
      const option = document.createElement('option');
      option.value = i;
      option.innerText = i === 100 ? '100% OFF (Grátis!)' : `${i}% OFF ou mais`;
      selectElement.appendChild(option);
    }

    async function buscarPromocoes() {
      const statusElement = document.getElementById('status');
      const gridElement = document.getElementById('games-grid');
      const descontoMinimo = selectElement.value;

      gridElement.innerHTML = '';
      statusElement.innerText = `Buscando jogos com no mínimo ${descontoMinimo}% de desconto... 🚀`;

      // API buscando jogos em promoção ordenados pelo maior desconto
      const API_URL = `https://www.cheapshark.com/api/1.0/deals?onSale=1&sortBy=Savings&pageSize=30`;

      try {
        const response = await fetch(API_URL);
        const data = await response.json();

        // Filtra os jogos de acordo com o desconto selecionado de 5 em 5
        const jogosFiltrados = data.filter(jogo => parseFloat(jogo.savings) >= parseFloat(descontoMinimo));

        statusElement.innerText = '';

        if (jogosFiltrados.length === 0) {
          statusElement.innerText = `Nenhum jogo encontrado com ${descontoMinimo}% de desconto no momento!`;
          return;
        }

        jogosFiltrados.forEach(jogo => {
          const card = document.createElement('div');
          card.className = 'card';
          card.tabIndex = 0;

          const dealLink = `https://www.cheapshark.com/redirect?dealID=${jogo.dealID}`;
          const porcentagem = Math.round(parseFloat(jogo.savings));
          const precoNormal = `$${jogo.normalPrice}`;
          const precoAtual = jogo.salePrice == '0.00' ? 'GRÁTIS' : `$${jogo.salePrice}`;

          card.innerHTML = `
            <img src="${jogo.thumb}" alt="${jogo.title}" onerror="this.src='https://via.placeholder.com/300x130?text=Promo%C3%A7%C3%A3o'">
            <div class="card-content">
              <div>
                <div class="price-tag">
                  <span class="badge-discount">-${porcentagem}%</span>
                  <span class="price-details"><s>${precoNormal}</s> ➔ <strong>${precoAtual}</strong></span>
                </div>
                <div class="card-title">${jogo.title}</div>
              </div>
              <a href="${dealLink}" target="_blank" class="btn-buy">Ver Oferta 🚀</a>
            </div>
          `;

          gridElement.appendChild(card);
        });

      } catch (error) {
        console.error('Erro:', error);
        statusElement.innerText = '❌ Erro ao carregar as promoções!';
      }
    }

    // Carrega os jogos de 100% OFF assim que abre o site
    buscarPromocoes();
  </script>
</body>
</html>
