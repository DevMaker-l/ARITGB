<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web 3D Block Engine - Cores e Modelagem</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 16px;
            font-size: 14px;
            font-weight: bold;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:active { transform: scale(0.95); }
        .control-group {
            background: rgba(0,0,0,0.85);
            padding: 12px;
            border-radius: 8px;
            color: white;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        input[type="text"] {
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #555;
            background: #222;
            color: white;
        }
    </style>
</head>
<body>

    <div id="ui">
        <button onclick="adicionarBloco()">+ Criar Bloco</button>
        
        <div class="control-group" id="transform-controls" style="display:none;">
            <span><strong>Editar Bloco:</strong></span>
            
            <div>
                <label>Cor (HEX): <input type="text" id="corHex" placeholder="#ff0000" oninput="mudarCor()"></label>
            </div>

            <hr style="border-color: #444; margin: 2px 0;">

            <div>
                <label>Largura (X): <input type="range" id="scaleX" min="0.5" max="5" step="0.1" value="1" oninput="mudarDimensoes()"></label>
            </div>
            <div>
                <label>Altura (Y): <input type="range" id="scaleY" min="0.5" max="5" step="0.1" value="1" oninput="mudarDimensoes()"></label>
            </div>
            <div>
                <label>Profundidade (Z): <input type="range" id="scaleZ" min="0.5" max="5" step="0.1" value="1" oninput="mudarDimensoes()"></label>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const luz = new THREE.DirectionalLight(0xffffff, 1);
        luz.position.set(5, 10, 7);
        scene.add(luz);
        scene.add(new THREE.AmbientLight(0x404040));

        camera.position.set(0, 5, 10);
        camera.lookAt(0, 0, 0);

        let blocos = [];
        let blocoSelecionado = null;

        function adicionarBloco() {
            const geometria = new THREE.BoxGeometry(1, 1, 1);
            const corInicial = 0x3498db; // Azul padrão inicial
            const material = new THREE.MeshStandardMaterial({ color: corInicial });
            
            const cubo = new THREE.Mesh(geometria, material);
            cubo.position.set(0, 0, 0);

            scene.add(cubo);
            blocos.push(cubo);
            
            selecionarBloco(cubo);
        }

        function selecionarBloco(bloco) {
            blocoSelecionado = bloco;
            document.getElementById('transform-controls').style.display = 'flex';
            
            // Atualiza os inputs com os valores atuais do bloco selecionado
            document.getElementById('scaleX').value = bloco.scale.x;
            document.getElementById('scaleY').value = bloco.scale.y;
            document.getElementById('scaleZ').value = bloco.scale.z;
            
            // Converte a cor atual do material para formato HEX para mostrar no input de texto
            let corAtualHex = '#' + bloco.material.color.getHexString();
            document.getElementById('corHex').value = corAtualHex;
        }

        function mudarDimensoes() {
            if (!blocoSelecionado) return;

            let sx = parseFloat(document.getElementById('scaleX').value);
            let sy = parseFloat(document.getElementById('scaleY').value);
            let sz = parseFloat(document.getElementById('scaleZ').value);

            blocoSelecionado.scale.set(sx, sy, sz);
        }

        function mudarCor() {
            if (!blocoSelecionado) return;

            let textoCor = document.getElementById('corHex').value;

            // Valida se o texto digitado parece um código HEX válido (ex: #ff0000 ou #00f)
            if (textoCor.startsWith('#') && (textoCor.length === 4 || textoCor.length === 7)) {
                blocoSelecionado.material.color.set(textoCor);
            }
        }

        function animar() {
            requestAnimationFrame(animar);
            renderer.render(scene, camera);
        }

        animar();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
