<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Portal AR Ajustado</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    .instrucao {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-family: sans-serif;
      z-index: 999;
      pointer-events: none;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="instrucao">Dê dois passos para trás para ver o portal inteiro!</div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <a-entity position="0 0 -4" scale="0.4 0.4 0.4">
      
      <a-torus position="0 0 0" radius="1" radius-tubular="0.08" color="#FFD700"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
      </a-torus>

      <a-circle position="0 0 -0.01" radius="0.95" color="#000033" opacity="0.85"
                 animation="property: scale; to: 1.05 1.05 1.05; loop: true; dur: 1200; direction: alternate; easing: easeInOutSine">
      </a-circle>
      
      <a-sphere position="0.8 1 0" radius="0.08" color="#00FFFF"
                 animation="property: position; to: -0.8 -1 0; loop: true; dur: 2500; direction: alternate; easing: easeInOutSine"></a-sphere>
      <a-sphere position="-0.8 1 0" radius="0.08" color="#FF00FF"
                 animation="property: position; to: 0.8 -1 0; loop: true; dur: 3000; direction: alternate; easing: easeInOutSine"></a-sphere>

    </a-entity>

    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>

                 animation="property: scale; to: 1.05 1.05 1.05; loop: true; dur: 1000; direction: alternate; easing: easeInOutSine">
      </a-circle>
      
      <a-sphere position="0.8 1.2 0" radius="0.05" color="#00FFFF"
                 animation="property: position; to: -0.8 -1.2 0; loop: true; dur: 3000; direction: alternate; easing: easeInOutSine"></a-sphere>
      <a-sphere position="-0.8 1.2 0" radius="0.05" color="#FFFF00"
                 animation="property: position; to: 0.8 -1.2 0; loop: true; dur: 3500; direction: alternate; easing: easeInOutSine"></a-sphere>
      <a-sphere position="1 -1 0" radius="0.05" color="#FF00FF"
                 animation="property: position; to: -1 1 0; loop: true; dur: 2800; direction: alternate; easing: easeInOutSine"></a-sphere>

    </a-entity>

    <a-entity camera></a-entity>
  </a-scene>

</body>
  </html>
