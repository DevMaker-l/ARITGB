<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forker & Limpador de HTML</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
            margin: 0;
        }
        h1 { color: #00ff88; }
        textarea {
            width: 100%;
            height: 200px;
            background-color: #1e1e1e;
            color: #00ff88;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            box-sizing: border-box;
            font-family: monospace;
        }
        .botoes {
            margin: 15px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            background-color: #00ff88;
            color: #000;
            border: none;
            padding: 12px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background-color: #00cc6c; }
        .btn-download { background-color: #00bfff; color: #fff; }
    </style>
</head>
<body>

    <h1>🛠️ Forker de Páginas Web</h1>
    <p>Cole o código HTML da página abaixo para modificar e criar sua versão:</p>

    <textarea id="codigoEntrada" placeholder="Cole o código HTML aqui..."></textarea>

    <div class="botoes">
        <button onclick="removerImagens()">🖼️ Remover Imagens</button>
        <button onclick="removerEstilos()">🎨 Limpar CSS</button>
        <button class="btn-download" onclick="baixarFork()">💾 Baixar meu Fork (.html)</button>
    </div>

    <script>
        // Função para remover todas as tags <img> do código
        function removerImagens() {
            let areaTexto = document.getElementById('codigoEntrada');
            let parser = new DOMParser();
            let doc = parser.parseFromString(areaTexto.value, 'text/html');

            let imagens = doc.querySelectorAll('img');
            imagens.forEach(img => img.remove());

            areaTexto.value = doc.documentElement.outerHTML;
            alert('Todas as imagens foram removidas!');
        }

        // Função para remover todas as tags <style> e links de CSS
        function removerEstilos() {
            let areaTexto = document.getElementById('codigoEntrada');
            let parser = new DOMParser();
            let doc = parser.parseFromString(areaTexto.value, 'text/html');

            let estilos = doc.querySelectorAll('style, link[rel="stylesheet"]');
            estilos.forEach(style => style.remove());

            areaTexto.value = doc.documentElement.outerHTML;
            alert('Estilos limpos com sucesso!');
        }

        // Função para gerar o arquivo e fazer download no celular/PC
        function baixarFork() {
            let codigo = document.getElementById('codigoEntrada').value;
            if (!codigo) {
                alert('Cole algum código antes de baixar!');
                return;
            }

            let blob = new Blob([codigo], { type: 'text/html' });
            let link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'meu_fork.html';
            link.click();
        }
    </script>
</body>
</html>
