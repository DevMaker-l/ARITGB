<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Info TV - Diagnóstico Ultra Leve</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #0d0f12;
      color: #00ffff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
    }
    h1 {
      font-size: 2.5rem;
      color: #ffd700;
      margin-bottom: 30px;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }
    .card {
      background: #161b22;
      border: 2px solid #00ffff;
      border-radius: 15px;
      padding: 25px;
      width: 80%;
      max-width: 800px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
    }
    .info-item {
      font-size: 1.4rem;
      margin: 15px 0;
      border-bottom: 1px solid #30363d;
      padding-bottom: 10px;
      color: #ffffff;
    }
    .info-item span {
      color: #00ffff;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>📺 Raio-X da Smart TV</h1>

  <div class="card">
    <div class="info-item">Sistema/Navegador: <span id="so">Detectando...</span></div>
    <div class="info-item">Resolução da Tela: <span id="res">Detectando...</span></div>
    <div class="info-item">Núcleos de Processador (CPU): <span id="cpu">Detectando...</span></div>
    <div class="info-item">Status da Conexão: <span id="rede">Detectando...</span></div>
    <div class="info-item">Linguagem do Sistema: <span id="lang">Detectando...</span></div>
  </div>

  <script>
    // Pega informações do navegador da TV
    const ua = navigator.userAgent;
    let sistema = "Desconhecido / Genérico";

    if (ua.includes("Tizen")) sistema = "Samsung Smart TV (Tizen)";
    else if (ua.includes("Web0S") || ua.includes("webOS")) sistema = "LG Smart TV (webOS)";
    else if (ua.includes("Android")) sistema = "Android TV / Google TV";
    else if (ua.includes("AFT")) sistema = "Amazon Fire TV";
    else if (ua.includes("Roku")) sistema = "Roku TV";
    else sistema = "Navegador Padrão (" + navigator.platform + ")";

    document.getElementById("so").innerText = sistema;
    document.getElementById("res").innerText = window.screen.width + " x " + window.screen.height + " px";
    document.getElementById("cpu").innerText = (navigator.hardwareConcurrency || "Não informado") + " núcleos";
    document.getElementById("rede").innerText = navigator.onLine ? "Conectado à Internet 🟢" : "Offline 🔴";
    document.getElementById("lang").innerText = navigator.language.toUpperCase();
  </script>

</body>
</html>
