<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Portal AR Ultra Otimizado</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    .instrucao {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: #00FFFF;
      padding: 8px 16px;
      border-radius: 15px;
      font-family: sans-serif;
      z-index: 999;
      pointer-events: none;
      text-align: center;
      font-size: 13px;
      border: 1px solid #00FFFF;
    }
  </style>
</head>
<body>
  <div class="instrucao">Modo Ultra Performance Ativo</div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960;">
    
    <a-entity position="0 0 -3" scale="0.35 0.35 0.35">
      
      <a-torus position="0 0 0" radius="1" radius-tubular="0.06" color="#FFD700"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear">
      </a-torus>

      <a-circle position="0 0 -0.01" radius="0.95" color="#000022" opacity="0.8"
                 animation="property: scale; to: 1.03 1.03 1.03; loop: true; dur: 1000; direction: alternate; easing: easeInOutSine">
      </a-circle>
      
      <a-sphere position="0.7 0.8 0" radius="0.06" color="#00FFFF"
                 animation="property: position; to: -0.7 -0.8 0; loop: true; dur: 2000; direction: alternate; easing: easeInOutSine"></a-sphere>
      <a-sphere position="-0.7 0.8 0" radius="0.06" color="#FF00FF"
                 animation="property: position; to: 0.7 -0.8 0; loop: true; dur: 2500; direction: alternate; easing: easeInOutSine"></a-sphere>

    </a-entity>

    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>
