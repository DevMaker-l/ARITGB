<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar de Jogos Standalone 🕹️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d1117;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 8px;
      color: #ff9900; /* Laranja estilo Half-Life / Sven Co-op */
      text-shadow: 0 0 12px rgba(255, 153, 0, 0.5);
    }

    p.subtitle {
      color: #8b949e;
      margin-bottom: 24px;
      font-size: 0.95rem;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1000px;
    }

    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover, .card:focus {
      transform: translateY(-5px);
      border-color: #ff9900;
      outline: none;
    }

    .card img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      background-color: #0d1117;
    }

    .card-content {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 6px;
      color: #f0f6fc;
    }

    .card-desc {
      font-size: 0.85rem;
      color: #8b949e;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .badge-standalone {
      background-color: #d97706;
      color: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: bold;
      width: fit-content;
      margin-bottom: 10px;
    }

    .btn-steam {
      display: block;
      text-align: center;
      background-color: #21262d;
      color: #ff9900;
      border: 1px solid #ff9900;
      text-decoration: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.2s, color 0.2s;
    }

    .btn-steam:hover {
      background-color: #ff9900;
      color: #0d1117;
    }
  </style>
</head>
<body>

  <h1>☣️ Radar de Standalones Grátis</h1>
  <p class="subtitle">Jogos lendários e mods independentes que NÃO precisam do jogo base pra rodar!</p>

  <div id="games-grid" class="grid"></div>

  <script>
    // Lista Curada dos Melhores Standalones Grátis da Steam
    const standaloneGames = [
      { id: 225840, name: "Sven Co-op", desc: "O pai dos standalones! Coop clássico baseado na engine GoldSrc de Half-Life." },
      { id: 17520, name: "Synergy", desc: "Jogue a campanha completa de Half-Life 2 inteira em coop com amigos!" },
      { id: 221910, name: "The Stanley Parable (Demo)", desc: "A famosa versão standalone original focada em escolhas e humor ácido." },
      { id: 440, name: "Team Fortress 2", desc: "Nasceu como mod de Quake/HL, virou standalone e mudou os shooters pra sempre." },
      { id: 238430, name: "Contagion / No More Room in Hell", desc: "NMH (AppID 224260) - Sobrevivência zumbi hardcore que era mod de HL2 e virou jogo solo." },
      { id: 224260, name: "No More Room in Hell", desc: "Zumbi coop ultra realista, de graça e totalmente independente!" },
      { id: 362890, name: "Black Mesa (Demo/Mod)", desc: "O remake supremo de Half-Life feito por fãs que virou standalone completo." },
      { id: 1172470, name: "Apex Legends", desc: "Evolução standalone do universo de Titanfall focado em Battle Royale." }
    ];

    function carregarStandalones() {
      const gridElement = document.getElementById('games-grid');

      standaloneGames.forEach(jogo => {
        const card = document.createElement('div');
        card.className = 'card';
        card.tabIndex = 0; // Navegação com controle da Smart TV

        // Capa automática gerada pela Steam via AppID
        const imgUrl = `https://cdn.cloudflare.steamstatic.com/steam/apps/${jogo.id}/header.jpg`;
        const steamLink = `https://store.steampowered.com/app/${jogo.id}/`;

        card.innerHTML = `
          <img src="${imgUrl}" alt="${jogo.name}" onerror="this.src='https://via.placeholder.com/300x130?text=Standalone+Game'">
          <div class="card-content">
            <div>
              <div class="badge-standalone">STANDALONE 100% GRÁTIS</div>
              <div class="card-title">${jogo.name}</div>
              <div class="card-desc">${jogo.desc}</div>
            </div>
            <a href="${steamLink}" target="_blank" class="btn-steam">Baixar na Steam 🚀</a>
          </div>
        `;

        gridElement.appendChild(card);
      });
    }

    carregarStandalones();
  </script>
</body>
</html>
