<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web 3D Block Engine</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
        }
        button {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="ui">
        <button onclick="adicionarBloco()">+ Adicionar Bloco</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // 1. Configuração Básica da Cena 3D
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Luz para iluminar os blocos
        const luz = new THREE.DirectionalLight(0xffffff, 1);
        luz.position.set(5, 10, 7);
        scene.add(luz);
        scene.add(new THREE.AmbientLight(0x404040));

        camera.position.set(0, 5, 10);
        camera.lookAt(0, 0, 0);

        // Array para guardar os blocos criados
        const blocos = [];

        // 2. Função que cria e adiciona um bloco 3D na tela
        function adicionarBloco() {
            const geometria = new THREE.BoxGeometry(1, 1, 1);
            
            // Cor aleatória para cada bloco adicionado
            const corAleatoria = Math.random() * 0xffffff;
            const material = new THREE.MeshStandardMaterial({ color: corAleatoria });
            
            const cubo = new THREE.Mesh(geometria, material);
            
            // Posiciona o bloco de forma espalhada aleatoriamente no centro
            cubo.position.set(
                (Math.random() - 0.5) * 6,
                (Math.random() * 3),
                (Math.random() - 0.5) * 6
            );

            scene.add(cubo);
            blocos.push(cubo);
        }

        // 3. Game Loop (Atualiza a tela e gira os blocos levemente)
        function animar() {
            requestAnimationFrame(animar);

            // Gira todos os blocos adicionados para dar vida à cena
            blocos.forEach(bloco => {
                bloco.rotation.x += 0.01;
                bloco.rotation.y += 0.01;
            });

            renderer.render(scene, camera);
        }

        animar();

        // Ajusta a tela se o celular/janela mudar de tamanho
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
