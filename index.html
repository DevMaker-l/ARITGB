<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Detector de Emuladores Mobile</title>
    <style>
        body { font-family: monospace; background: #111; color: #0f0; padding: 20px; }
        .box { border: 1px solid #0f0; padding: 15px; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>🔍 Verificador de Compatibilidade Mobile</h1>
    <div class="box" id="resultado">Analisando seu hardware...</div>

    <script>
        function analisarDispositivo() {
            const ua = navigator.userAgent;
            const divResultado = document.getElementById('resultado');
            
            // Detectando se é Android
            let isAndroid = /Android/.test(ua);
            let androidVersion = "Desconhecida";
            
            if (isAndroid) {
                let match = ua.match(/Android\s([0-9\.]*)/);
                if (match) {
                    androidVersion = match[1];
                }
            }

            // Lógica de recomendação baseada no sistema
            let recomendacao = "";
            let majorVersion = parseInt(androidVersion);

            if (!isAndroid) {
                recomendacao = "⚠️ Este site foi feito para dispositivos Android!";
            } else if (majorVersion < 10) {
                recomendacao = "🔴 Versão antiga do Android. Sugestão: Forks leves de emuladores 2D ou PPSSPP.";
            } else if (majorVersion >= 10 && majorVersion < 12) {
                recomendacao = "🟡 Android intermediário. Compatível com Winlator (versões otimizadas) e GameHub, dependendo do seu processador.";
            } else {
                recomendacao = "🟢 Android moderno! Alta compatibilidade com Winlator, GameHub e emuladores pesados.";
            }

            divResultado.innerHTML = `
                <strong>User-Agent:</strong> ${ua} <br><br>
                <strong>Sistema:</strong> ${isAndroid ? 'Android ' + androidVersion : 'Outro sistema'} <br><br>
                <strong>Diagnóstico de Emuladores:</strong><br>${recomendacao}
            `;
        }

        analisarDispositivo();
    </script>

</body>
</html>
