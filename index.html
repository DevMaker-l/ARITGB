<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Primeiro App 3D AR</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <a-marker preset="hiro">
      
      <a-box 
        id="meu-cubo"
        position="0 0.5 0" 
        material="color: red;" 
        animation="property: rotation; to: 0 360 0; loop: true; dur: 4000">
      </a-box>

      <a-text 
        value="APP 3D FUNCIONANDO!" 
        position="-1 1.5 0" 
        color="#FFFFFF" 
        scale="0.8 0.8 0.8">
      </a-text>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Análise de script: Evento de clique no cubo para mudar de cor
    const cubo = document.querySelector('#meu-cubo');
    cubo.addEventListener('click', () => {
      const cores = ['red', 'blue', 'green', 'yellow', 'purple'];
      const corAleatoria = cores[Math.floor(Math.random() * cores.length)];
      cubo.setAttribute('material', 'color', corAleatoria);
    });
  </script>
</body>
</html>
