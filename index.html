<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Meu App 3D sem Marcador</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    .instrucao {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-family: sans-serif;
      z-index: 999;
      pointer-events: none;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="instrucao">Toque na tela para mudar a cor do cubo!</div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <a-box id="meuCubo" position="0 0 -2" rotation="0 45 45" scale="0.5 0.5 0.5" color="#FF0000"
           animation="property: rotation; to: 360 405 45; loop: true; dur: 4000; easing: linear">
    </a-box>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Código JavaScript para mudar a cor do cubo quando tocar na tela do celular
    const cubo = document.getElementById('meuCubo');
    const cores = ['#FF0000', '#00FF00', '#0000FF', '#FFFF00', '#FF00FF', '#00FFFF'];
    let indiceCor = 0;

    window.addEventListener('click', () => {
      indiceCor = (indiceCor + 1) % cores.length;
      cubo.setAttribute('color', cores[indiceCor]);
    });
  </script>
</body>
</html>
