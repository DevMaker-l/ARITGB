<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central Gigante Free-To-Play 🕹️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0e14;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 8px;
      color: #00ffcc;
      text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
    }

    p.subtitle {
      color: #8a99ad;
      margin-bottom: 20px;
      font-size: 0.95rem;
      text-align: center;
    }

    .status {
      margin: 20px 0;
      font-size: 1.1rem;
      color: #ffcc00;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1200px;
    }

    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover, .card:focus {
      transform: translateY(-5px);
      border-color: #00ffcc;
      outline: none;
    }

    .card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      background-color: #0d1117;
    }

    .card-content {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: bold;
      margin-bottom: 6px;
      color: #ffffff;
    }

    .card-desc {
      font-size: 0.8rem;
      color: #8a99ad;
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .tags {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .badge {
      background-color: #21262d;
      color: #00ffcc;
      border: 1px solid #00ffcc;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: bold;
    }

    .btn-play {
      display: block;
      text-align: center;
      background-color: #238636;
      color: #ffffff;
      text-decoration: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn-play:hover {
      background-color: #2ea043;
    }
  </style>
</head>
<body>

  <h1>🚀 Central Gigante de Jogos Grátis</h1>
  <p class="subtitle">Carregando o catálogo completo de jogos Free-To-Play pra você rechear a biblioteca!</p>

  <div id="status" class="status">Buscando catálogo gigante... ⏳</div>
  <div id="games-grid" class="grid"></div>

  <script>
    // Usando um proxy CORS seguro para puxar a API do FreeToGame sem bloqueios
    const API_URL = 'https://corsproxy.io/?https://www.freetogame.com/api/games';

    async function carregarTodosOsJogos() {
      const statusElement = document.getElementById('status');
      const gridElement = document.getElementById('games-grid');

      try {
        const response = await fetch(API_URL);
        const data = await response.json();

        statusElement.innerText = '';

        if (!data || data.length === 0) {
          statusElement.innerText = 'Nenhum jogo encontrado!';
          return;
        }

        // Exibe os jogos do catálogo automaticamente
        data.forEach(jogo => {
          const card = document.createElement('div');
          card.className = 'card';
          card.tabIndex = 0; // Suporte para Smart TV/Teclado

          card.innerHTML = `
            <img src="${jogo.thumbnail}" alt="${jogo.title}" onerror="this.src='https://via.placeholder.com/300x140?text=Jogo+Gr%C3%A1tis'">
            <div class="card-content">
              <div>
                <div class="tags">
                  <span class="badge">${jogo.genre}</span>
                  <span class="badge">${jogo.platform.includes('PC') ? 'PC' : 'BROWSER'}</span>
                </div>
                <div class="card-title">${jogo.title}</div>
                <div class="card-desc">${jogo.short_description}</div>
              </div>
              <a href="${jogo.game_url}" target="_blank" class="btn-play">Resgatar / Jogar 🎮</a>
            </div>
          `;

          gridElement.appendChild(card);
        });

      } catch (error) {
        console.error('Erro ao buscar jogos:', error);
        statusElement.innerText = '❌ Erro ao carregar a lista gigante. Tente recarregar a página!';
      }
    }

    carregarTodosOsJogos();
  </script>
</body>
</html>
