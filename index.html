<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar Steam Free-To-Play 🕹️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0e14;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 8px;
      color: #66c0f4; /* Azul clássico Steam */
      text-shadow: 0 0 10px rgba(102, 192, 244, 0.5);
    }

    p.subtitle {
      color: #8a99ad;
      margin-bottom: 24px;
      font-size: 0.95rem;
    }

    .status {
      margin: 20px 0;
      font-size: 1.1rem;
      color: #ffcc00;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1000px;
    }

    .card {
      background-color: #171a21;
      border: 1px solid #2a475e;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover, .card:focus {
      transform: translateY(-5px);
      border-color: #66c0f4;
      outline: none;
    }

    .card img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      background-color: #0b0e14;
    }

    .card-content {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .card-title {
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 10px;
      color: #c6d4df;
    }

    .badge-f2p {
      background-color: #47b147;
      color: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      width: fit-content;
      margin-bottom: 12px;
    }

    .btn-steam {
      display: block;
      text-align: center;
      background-color: #214b6b;
      color: #66c0f4;
      border: 1px solid #66c0f4;
      text-decoration: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.2s, color 0.2s;
    }

    .btn-steam:hover {
      background-color: #66c0f4;
      color: #0b0e14;
    }
  </style>
</head>
<body>

  <h1>🎮 Radar Steam Free-To-Play</h1>
  <p class="subtitle">Lista dos melhores jogos 100% gratuitos para jogar na Steam!</p>

  <div id="status" class="status">Carregando lista da Steam... 🚀</div>
  <div id="games-grid" class="grid"></div>

  <script>
    // Lista de AppIDs dos maiores e melhores Free-to-Play da Steam
    const f2pGames = [
      { id: 730, name: "Counter-Strike 2" },
      { id: 570, name: "Dota 2" },
      { id: 1172470, name: "Apex Legends" },
      { id: 578080, name: "PUBG: BATTLEGROUNDS" },
      { id: 230410, name: "Warframe" },
      { id: 1085660, name: "Destiny 2" },
      { id: 440, name: "Team Fortress 2" },
      { id: 304930, name: "Unturned" },
      { id: 252490, name: "Rust (Trial)" },
      { id: 1938090, name: "Call of Duty: Warzone" }
    ];

    function carregarJogosSteam() {
      const statusElement = document.getElementById('status');
      const gridElement = document.getElementById('games-grid');

      statusElement.innerText = '';

      f2pGames.forEach(jogo => {
        const card = document.createElement('div');
        card.className = 'card';
        card.tabIndex = 0; // Suporte a controle/teclado para TV

        // A Steam gera capas automáticas por este link oficial usando o ID do jogo
        const imgUrl = `https://cdn.cloudflare.steamstatic.com/steam/apps/${jogo.id}/header.jpg`;
        const steamLink = `https://store.steampowered.com/app/${jogo.id}/`;

        card.innerHTML = `
          <img src="${imgUrl}" alt="${jogo.name}" onerror="this.src='https://via.placeholder.com/300x130?text=Steam+Game'">
          <div class="card-content">
            <div>
              <div class="badge-f2p">FREE-TO-PLAY</div>
              <div class="card-title">${jogo.name}</div>
            </div>
            <a href="${steamLink}" target="_blank" class="btn-steam">Ver na Steam 🚀</a>
          </div>
        `;

        gridElement.appendChild(card);
      });
    }

    carregarJogosSteam();
  </script>
</body>
</html>
