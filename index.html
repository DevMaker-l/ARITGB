<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Backrooms WebAR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    .instrucao {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: #FFD700;
      padding: 10px 20px;
      border-radius: 20px;
      font-family: sans-serif;
      z-index: 999;
      pointer-events: none;
      text-align: center;
      font-size: 14px;
      border: 1px solid #FFD700;
    }
  </style>
</head>
<body>
  <div class="instrucao">Cuidado... Você fez noclip nas Backrooms! 🟡</div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <a-light type="ambient" color="#FFF5CC" intensity="0.6"></a-light>
    <a-light type="point" position="0 2.8 -3" color="#FFFF99" intensity="0.8"
             animation="property: intensity; to: 0.2; loop: true; dur: 150; direction: alternate; easing: linear"></a-light>

    <a-entity position="0 0 0">
      <a-box position="-1.5 1.5 -3" width="0.1" height="3" depth="6" color="#C2B280"></a-box>
      
      <a-box position="1.5 1.5 -3" width="0.1" height="3" depth="6" color="#C2B280"></a-box>
      
      <a-plane position="0 3 -3" rotation="90 0 0" width="3" height="6" color="#CCCCCC"></a-plane>
      
      <a-box position="0 2.95 -3" width="0.4" height="0.05" depth="2" color="#FFFFFF"></a-box>

      <a-plane position="0 0 -3" rotation="-90 0 0" width="3" height="6" color="#7A6E5D"></a-plane>
      
      <a-box position="-1 1.5 -6" width="1" height="3" depth="0.1" color="#C2B280"></a-box>
      <a-box position="1 1.5 -6" width="1" height="3" depth="0.1" color="#C2B280"></a-box>
      <a-box position="0 2.5 -6" width="1" height="1" depth="0.1" color="#C2B280"></a-box>
    </a-entity>

    <a-entity position="0 1 -5.8" scale="0.35 0.35 0.35">
      
      <a-torus position="0 0 0" radius="1" radius-tubular="0.08" color="#FFD700"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
      </a-torus>

      <a-circle position="0 0 -0.01" radius="0.95" color="#000033" opacity="0.85"
                 animation="property: scale; to: 1.05 1.05 1.05; loop: true; dur: 1200; direction: alternate; easing: easeInOutSine">
      </a-circle>
      
      <a-sphere position="0.8 1 0" radius="0.08" color="#00FFFF"
                 animation="property: position; to: -0.8 -1 0; loop: true; dur: 2500; direction: alternate; easing: easeInOutSine"></a-sphere>
      <a-sphere position="-0.8 1 0" radius="0.08" color="#FF00FF"
                 animation="property: position; to: 0.8 -1 0; loop: true; dur: 3000; direction: alternate; easing: easeInOutSine"></a-sphere>

    </a-entity>

    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>
