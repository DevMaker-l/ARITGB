<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspecionador de ZIP - Hub</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            font-family: monospace;
            background-color: #0d1117;
            color: #c9d1d9;
            padding: 20px;
            margin: 0;
        }
        h1 { color: #58a6ff; }
        .upload-box {
            border: 2px dashed #30363d;
            padding: 20px;
            border-radius: 6px;
            text-align: center;
            background-color: #161b22;
            margin-bottom: 15px;
        }
        input[type="file"] { color: #58a6ff; }
        .resultado-box {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 15px;
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        ul { padding-left: 20px; }
        li { margin-bottom: 5px; color: #79c0ff; }
    </style>
</head>
<body>

    <h1>📦 Inspecionador de Arquivos .ZIP</h1>
    <p>Jogue ou selecione um arquivo .zip para ver a estrutura interna de arquivos:</p>

    <div class="upload-box">
        <input type="file" id="arquivoZip" accept=".zip" onchange="lerZip(event)">
    </div>

    <h3>Estrutura Encontrada:</h3>
    <div id="saidaResultado" class="resultado-box">Nenhum arquivo carregado ainda...</div>

    <script>
        async function lerZip(event) {
            let arquivo = event.target.files[0];
            let saida = document.getElementById('saidaResultado');

            if (!arquivo) return;

            saida.innerText = "Lendo e descompactando o arquivo... Aguarde!";

            try {
                let jszip = new JSZip();
                let conteudoZip = await jszip.loadAsync(arquivo);
                
                let listaHTML = "--- ARQUIVOS DENTRO DO ZIP ---\n\n<ul>";
                let totalArquivos = 0;

                // Percorre todos os arquivos de dentro do zip
                let promessas = [];
                conteudoZip.forEach((caminhoRelativo, arquivoNoZip) => {
                    totalArquivos++;
                    listaHTML += `<li>📁 ${caminhoRelativo} ${arquivoNoZip.dir ? '(Pasta)' : ''}</li>`;
                });

                listaHTML += "</ul>\n<br>Total de itens encontrados: " + totalArquivos;
                saida.innerHTML = listaHTML;

            } catch (erro) {
                saida.innerText = "Erro ao ler o arquivo ZIP. Certifique-se de que é um arquivo válido!";
                console.error(erro);
            }
        }
    </script>
</body>
</html>
