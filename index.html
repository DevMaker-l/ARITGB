<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Meu Portal AR Sem Marcador</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    .instrucao {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 12px 24px;
      border-radius: 20px;
      font-family: sans-serif;
      z-index: 999;
      pointer-events: none;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="instrucao">Olhe para a frente! O portal vai aparecer!</div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <a-entity position="0 1 -1.5" rotation="0 0 0">
      
      <a-torus position="0 0 0" radius="1" radius-tubular="0.05" color="#FFD700"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
      </a-torus>

      <a-circle position="0 0 0.01" radius="0.95" color="#000033" opacity="0.8"
                 animation="property: scale; to: 1.05 1.05 1.05; loop: true; dur: 1000; direction: alternate; easing: easeInOutSine">
      </a-circle>
      
      <a-sphere position="0.8 1.2 0" radius="0.05" color="#00FFFF"
                 animation="property: position; to: -0.8 -1.2 0; loop: true; dur: 3000; direction: alternate; easing: easeInOutSine"></a-sphere>
      <a-sphere position="-0.8 1.2 0" radius="0.05" color="#FFFF00"
                 animation="property: position; to: 0.8 -1.2 0; loop: true; dur: 3500; direction: alternate; easing: easeInOutSine"></a-sphere>
      <a-sphere position="1 -1 0" radius="0.05" color="#FF00FF"
                 animation="property: position; to: -1 1 0; loop: true; dur: 2800; direction: alternate; easing: easeInOutSine"></a-sphere>

    </a-entity>

    <a-entity camera></a-entity>
  </a-scene>

</body>
  </html>
